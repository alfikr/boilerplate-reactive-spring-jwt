spring:
  application:
    name: boilerplate
  profiles:
    # Used only when no profile is given (SPRING_PROFILES_ACTIVE). Never ship prod without
    # setting the profile explicitly.
    default: dev
  # Runtime access: R2DBC (non-blocking). The same database is reached over JDBC by Flyway
  # only, once, at startup.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      max-acquire-time: 5s
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

application:
  security:
    # Base64 HMAC key, >= 64 bytes (HS512). Generate: openssl rand -base64 64
    # No default on purpose: startup fails if JWT_SECRET is not provided.
    secret: ${JWT_SECRET:}
    token-validity-seconds: 86400            # 24h
    token-validity-seconds-remember-me: 2592000  # 30d
  cors:
    allowed-origins: []
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    base-url: ${APP_BASE_URL:http://localhost:8080}
